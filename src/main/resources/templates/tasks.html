<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление задачами</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 40px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .button, button {
      display: inline-block;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      background: #007bff;
      text-decoration: none;
      font-size: 14px;
    }

    .button:hover, button:hover {
      opacity: 0.85;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .task {
      background: #f8f9fa;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
      border-left: 5px solid #007bff;
    }

    .completed {
      border-left-color: #28a745;
      opacity: 0.7;
    }

    .completed h3 {
      text-decoration: line-through;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .delete {
      background: #dc3545;
    }

    .complete {
      background: #28a745;
    }

    .edit {
      background: #ffc107;
      color: #222;
    }

    .filter-completed {
      background: #28a745;
    }

    .filter-pending {
      background: #6c757d;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📋 Управление задачами</h1>

  <!-- Создание новой задачи -->
  <a th:href="@{/tasks/new}" class="button">
    + Создать задачу
  </a>

  <hr>

  <h2>Список задач</h2>

  <!-- Фильтрация задач -->
  <div class="filters">

    <a th:href="@{/tasks}" class="button">
      Все задачи
    </a>

    <a th:href="@{/tasks/filter(completed=true)}"
       class="button filter-completed">
      Выполненные
    </a>

    <a th:href="@{/tasks/filter(completed=false)}"
       class="button filter-pending">
      Невыполненные
    </a>

  </div>

  <!-- Сообщение при отсутствии задач -->
  <p th:if="${#lists.isEmpty(tasks)}">
    Задач не найдено.
  </p>

  <!-- Список задач -->
  <div th:each="task : ${tasks}"
       class="task"
       th:classappend="${task.completed} ? 'completed' : ''">

    <h3 th:text="${task.title}">
      Название задачи
    </h3>

    <p th:text="${task.description}">
      Описание задачи
    </p>

    <p>
      <strong>Срок:</strong>
      <span th:text="${task.deadline != null ? task.deadline : 'Не указан'}"></span>
    </p>

    <p>
      <strong>Статус:</strong>
      <span th:text="${task.completed ? 'Выполнено' : 'Не выполнено'}"></span>
    </p>

    <div class="actions">

      <!-- Редактирование -->
      <a th:href="@{/tasks/edit/{id}(id=${task.id})}"
         class="button edit">
        Редактировать
      </a>

      <!-- Отметить выполненной -->
      <form th:if="${!task.completed}"
            th:action="@{/tasks/complete/{id}(id=${task.id})}"
            method="post">

        <button type="submit" class="complete">
          Выполнено
        </button>

      </form>

      <!-- Удаление -->
      <form th:action="@{/tasks/delete/{id}(id=${task.id})}"
            method="post">

        <button type="submit" class="delete">
          Удалить
        </button>

      </form>

    </div>

  </div>

</div>

</body>
</html>
